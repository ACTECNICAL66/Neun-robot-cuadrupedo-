; ============================================================================
; ARAÑA ROBOT — Firmware ESP32-S3
; Plataforma: PlatformIO | Board: ESP32-S3-DevKitC-1 | Framework: Arduino
;
; Comandos útiles:
;   pio run               -> compila
;   pio run -t upload     -> flashea por USB
;   pio device monitor    -> Monitor Serie (115200 baud)
; ============================================================================

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Puerto serie
monitor_speed = 115200
upload_speed  = 921600

; -Isrc permite incluir desde cualquier módulo: #include "config.h",
; #include "actuadores/buzzer.h", etc.
build_flags =
    -Isrc

; Dependencias (se descargan automáticamente en el primer build)
;   ESPAsyncWebServer + AsyncTCP -> API REST no bloqueante (/api/status, /api/command)
;   Adafruit PWM Servo Driver    -> PCA9685 (12 servos)
;   Adafruit MPU6050 + Unified   -> IMU MPU6050
;   Adafruit NeoPixel            -> Matriz 8x8
;   DHT sensor library           -> DHT22
lib_deps =
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit NeoPixel
    adafruit/DHT sensor library